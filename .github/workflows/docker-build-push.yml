name: Energy Saver rApp - Build, Scan and Push

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  energy-saver-rapp:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Energy Saver rApp
        uses: docker/build-push-action@v6
        with:
          context: ./rapp/energy-saver
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/energy-saver-rapp:latest

      - name: Scan Energy Saver rApp with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/energy-saver-rapp:latest
          format: sarif
          output: energy-trivy.sarif
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy SARIF report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: energy-trivy.sarif

      - name: Push Energy Saver rApp to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/energy-saver-rapp:latest
