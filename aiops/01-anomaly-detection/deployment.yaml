apiVersion: v1
kind: ConfigMap
metadata:
  name: anomaly-detector-script
  namespace: ricrapp
data:
  requirements.txt: |
    numpy
    scikit-learn
    influxdb
    kafka-python
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly-detector
  namespace: ricrapp
  labels:
    app: anomaly-detector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anomaly-detector
  template:
    metadata:
      labels:
        app: anomaly-detector
    spec:
      containers:
        - name: anomaly-detector
          image: python:3.11-slim
          command: ["sh", "-c"]
          args:
            - "pip install --no-cache-dir -r /app/requirements.txt --quiet && python /app/anomaly_detector.py"
          env:
            - name: INFLUXDB_HOST
              value: "influxdb.smo.svc.cluster.local"
            - name: KAFKA_BOOTSTRAP
              value: "nonrtric-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
            - name: POLL_INTERVAL_SECONDS
              value: "30"
          volumeMounts:
            - name: script
              mountPath: /app/anomaly_detector.py
              subPath: anomaly_detector.py
            - name: reqs
              mountPath: /app/requirements.txt
              subPath: requirements.txt
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
      volumes:
        - name: script
          configMap:
            name: anomaly-detector-code
        - name: reqs
          configMap:
            name: anomaly-detector-script
