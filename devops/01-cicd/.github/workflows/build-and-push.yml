name: Build, Test and Push Energy-Saver Components

on:
  push:
    branches: [main]
    paths:
      - "aiops/**"
      - "scripts/prometheus-ves-bridge/**"
      - "helm-charts/**"
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - aiops/01-anomaly-detection
          - aiops/02-forecasting
          - aiops/03-rca
          - aiops/04-auto-remediation
          - aiops/05-ml-surrogate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install flake8 black --quiet

      - name: Lint (flake8)
        run: flake8 ${{ matrix.component }} --max-line-length=120 --extend-ignore=E203 || true

      - name: Format check (black)
        run: black --check ${{ matrix.component }} || true

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Lint Helm charts
        run: |
          for chart in devops/04-helm-charts/*/; do
            echo "Linting $chart"
            helm lint "$chart"
          done

  build-and-push:
    needs: [lint-and-test, helm-lint]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component:
          - name: prometheus-ves-bridge
            context: scripts/prometheus-ves-bridge
          - name: anomaly-detector
            context: aiops/01-anomaly-detection
          - name: load-forecaster
            context: aiops/02-forecasting
          - name: rca-correlator
            context: aiops/03-rca
          - name: auto-remediator
            context: aiops/04-auto-remediation
          - name: ml-surrogate
            context: aiops/05-ml-surrogate
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.component.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.component.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.component.name }}:latest

  e2e-tests:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run E2E pipeline test against staging cluster
        run: bash devops/05-e2e-tests/test_e2e_pipeline.sh
        env:
          KUBECONFIG_CONTENT: ${{ secrets.STAGING_KUBECONFIG }}
